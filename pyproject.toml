[project]
name = "usdol-wage-determination-data"
version = "0.1.0"
license = { file = "LICENSE.md" }
requires-python = ">=3.13"
dependencies = [
    "cachier>=3.1.2",
    "httpx>=0.28.1",
    "jsonschema>=4.24.0",
    "orjson>=3.10.18",
    "us>=3.2.0",
    "usdol-wage-determination-model>=0.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "safety>=3.2.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
